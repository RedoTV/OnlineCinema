services:
  db:
    image: postgres:16-alpine
    container_name: onlinecinema_postgres
    restart: always
    ports:
      - "5001:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - onlinecinema_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: onlinecinema_minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - onlinecinema_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: onlinecinema_rabbitmq
    restart: always
    # profile полный — но rabbit поднимается и в базе, чтобы бэкенд мог пушить события
    networks:
      - onlinecinema_network
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./src/OnlineCinema.Backend
      dockerfile: Dockerfile
    container_name: onlinecinema_backend
    restart: always
    ports:
      - "5000:80"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - onlinecinema_network

  frontend:
    build:
      context: ./src/OnlineCinema.Frontend
      dockerfile: Dockerfile
    container_name: onlinecinema_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
      minio:
        condition: service_healthy
      analytics:
        condition: service_started
    networks:
      - onlinecinema_network

  # Analytics входит в демонстрационный стек (Python/FastAPI, зависимости через uv).
  analytics:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    container_name: onlinecinema_analytics
    restart: always
    ports:
      - "8000:8000"
    environment:
      PG_HOST: db
      PG_DB: ${POSTGRES_DB}
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      RABBIT_HOST: rabbitmq
      RABBIT_USER: ${RABBITMQ_USER}
      RABBIT_PASSWORD: ${RABBITMQ_PASS}
      RabbitMQ_HOST: rabbitmq
      CONSUMER_ENABLED: "true"
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - onlinecinema_network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  onlinecinema_network:
    driver: bridge
