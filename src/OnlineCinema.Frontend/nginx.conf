server {
    listen 80;
    
    # Раздача фронтенда
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Проксирование запросов к API на бэкенд
    location /api/ {
        proxy_pass http://backend:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Проксирование Swagger (если нужно)
    location /swagger/ {
        proxy_pass http://backend:80/swagger/;
        proxy_set_header Host $host;
    }

    # Browser cannot resolve the Docker-only hostname from a presigned link.
    # Держим оригинальный Host для SigV4 и не буферизуем видео целиком.
    location /media/ {
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host minio:9000;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Старые локальные ссылки оставлены совместимыми с ранними данными.
    location /static/ {
        proxy_pass http://backend:80/static/;
        proxy_set_header Host $host;
    }
}