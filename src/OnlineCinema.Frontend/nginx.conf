server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Admins upload feature-length videos through this proxy. Keep the body
        # on disk/streamed rather than applying nginx's 1 MB default limit.
        client_max_body_size 10g;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://backend:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /swagger/ {
        proxy_pass http://backend:80/swagger/;
        proxy_set_header Host $host;
    }

    # Analytics API живёт под /api/analytics/, а НЕ под /analytics/:
    # префикс /analytics/ перехватывал бы SPA-роут /analytics (страница
    # дашборда) — nginx 301-редиректил его с потерей порта, и страница
    # была недоступна. Длинный префикс всегда выигрывает у /api/.
    location /api/analytics/ {
        proxy_pass http://analytics:8000/;
        proxy_set_header Host $host;
    }

    # Браузер не знает Docker DNS. Оставляем подписанный Host для MinIO,
    # а клиенту показываем аккуратный same-origin URL.
    location /media/ {
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host minio:9000;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /static/ {
        proxy_pass http://backend:80/static/;
        proxy_set_header Host $host;
    }
}
