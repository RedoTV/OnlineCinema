name: Release

# Тегается релиз автоматически при пуше тега вида vX.Y.Z.
# Собирает образы и читает чейнджлог из GH release notes (заполняются вручную
# либо через conventional-changelog локально).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta (backend)
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Docker meta (frontend)
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./src/OnlineCinema.Backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./src/OnlineCinema.Frontend
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}

      # чейнджлог из conventional commits между последним тегом и этим
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            docker-compose.yml
            .env.example
            docs/postman/OnlineCinema.postman_collection.json
